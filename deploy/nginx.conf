# Remedi 前端 nginx 配置：托管 dist + 反代 /api 到后端容器
server {
    listen 80;
    server_name _;

    # 上传体积放行：与后端上限对齐（练习册 PDF ≤30MB、作业照片 ≤10MB）。
    # 不设这一行时 nginx 默认只放行 1MB，大文件会在网关被 413 拦下、根本到不了后端。
    client_max_body_size 30m;
    # 大文件在慢网络下传得久，放宽请求体读取超时，避免传一半被掐断
    client_body_timeout 300s;

    # 学习助手 SSE：关闭代理缓冲，让模型 token 到达后立即转发给浏览器。
    location = /api/student/agent/chat/stream {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 120s;
    }

    # 教师助手同样实时转发模型 token，避免 Nginx 缓冲整段回复。
    location = /api/teacher/agent/chat/stream {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 120s;
    }

    # 后端 API 反代（注意 location 的顺序：/api/ 优先匹配）
    location /api/ {
        proxy_pass http://api:8000;
        proxy_read_timeout 120s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 前端 SPA：静态资源 + history 路由回退
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
