# Remedi 前端 nginx 配置：托管 dist + 反代 /api 到后端容器
server {
    listen 80;
    server_name _;

    # 常规上传仍按各自接口限制；RAG PDF 导入单独取消网关体积上限。
    client_max_body_size 30m;
    # 大文件在慢网络下传得久，放宽请求体读取超时，避免传一半被掐断
    client_body_timeout 300s;

    # 压缩 JS/CSS/JSON/SVG 等文本响应；SSE 的 text/event-stream 不在压缩范围内。
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types application/javascript application/json application/xml image/svg+xml text/css text/plain;

    # 学习助手 SSE：关闭代理缓冲，让模型 token 到达后立即转发给浏览器。
    location = /api/student/agent/chat/stream {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        # 后端模型请求超时为 120s；图片讲解可能再走一次流式兜底，给 SSE 留足返回窗口。
        proxy_read_timeout 300s;
    }

    # 学生图片问答直接流经视觉模型，同样关闭缓冲以便逐块渲染。
    location = /api/student/agent/chat/vision/stream {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        # 视觉模型首字可能较慢，需覆盖后端请求超时并让后端送出 SSE 错误事件。
        proxy_read_timeout 300s;
    }

    # 教师助手同样实时转发模型 token，避免 Nginx 缓冲整段回复。
    location = /api/teacher/agent/chat/stream {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        # 允许模型超时和流式错误事件完整返回浏览器。
        proxy_read_timeout 300s;
    }

    # 学科 Agent 知识库 PDF 由 PyMuPDF 按实际页数和文本内容处理，不设上传体积上限。
    location ~ ^/api/teacher/knowledge/[^/]+/import-pdf$ {
        client_max_body_size 0;
        proxy_pass http://api:8000;
        proxy_read_timeout 300s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 后端 API 反代（注意 location 的顺序：/api/ 优先匹配）
    location /api/ {
        proxy_pass http://api:8000;
        # 后端模型等待上限默认 120s；留出 60s 让后端整理并返回结果或超时提示。
        proxy_read_timeout 180s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 前端 SPA：静态资源 + history 路由回退
    # Vite 构建产物带内容哈希，可长期缓存；缺失的旧资源直接 404，避免回退成 HTML。
    location ^~ /assets/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 入口页每次重新校验，确保部署后能发现新的哈希资源名。
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache" always;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
