# Remedi MVP 一键部署
# 用法：docker compose up -d --build
# 前端：http://服务器公网IP:5001；后端：http://服务器公网IP:5000

services:
  api:
    build:
      context: ./backend
      network: ${BUILD_NETWORK:-default}
    expose:
      - "8000"
    ports:
      - "${API_PORT:-5000}:8000"
    volumes:
      - remedi-data:/data
    environment:
      # SQLite 落盘到命名卷，容器重建数据不丢
      - DATABASE_URL=sqlite:////data/remedi.db
      - UPLOAD_DIR=/data/uploads
      - CORS_ORIGINS=*
      - APP_TIMEZONE=${APP_TIMEZONE:-Asia/Shanghai}
      - SEED_DEMO_DATA=${SEED_DEMO_DATA:-true}
      # 对话/视觉模型配置；实际生产后端由宝塔运行，不通过 Compose 启动。
      - LLM_PROVIDER=${LLM_PROVIDER:-openai-compatible}
      - LLM_TIMEOUT_SECONDS=${LLM_TIMEOUT_SECONDS:-120}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_BASE_URL=${LLM_BASE_URL:-}
      - LLM_MODEL=${LLM_MODEL:-}
      - LLM_VISION_MODEL=${LLM_VISION_MODEL:-}
      # DashScope 变量仅为旧部署保留；RAG 默认复用 LLM 的 AI Ping Key 与 Base URL。
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY:-}
      - DASHSCOPE_BASE_URL=${DASHSCOPE_BASE_URL:-}
      - DASHSCOPE_MODEL=${DASHSCOPE_MODEL:-qwen3.8-flash}
      - DASHSCOPE_VISION_MODEL=${DASHSCOPE_VISION_MODEL:-qwen3.8-flash}
      - RAG_API_KEY=${RAG_API_KEY:-}
      - RAG_BASE_URL=${RAG_BASE_URL:-}
      - RAG_MILVUS_URI=${RAG_MILVUS_URI:-}
      - RAG_MILVUS_TOKEN=${RAG_MILVUS_TOKEN:-}
      - RAG_MILVUS_COLLECTION=${RAG_MILVUS_COLLECTION:-remedi_subject_knowledge_qwen3_embedding4b}
      - RAG_EMBEDDING_MODEL=${RAG_EMBEDDING_MODEL:-Qwen3-Embedding-4B}
      - RAG_EMBEDDING_DIMENSIONS=${RAG_EMBEDDING_DIMENSIONS:-1024}
      - RAG_TIMEOUT_SECONDS=${RAG_TIMEOUT_SECONDS:-8}
      - RAG_RERANK_MODEL=${RAG_RERANK_MODEL:-Qwen3-Reranker-0.6B}
      - RAG_RERANK_TIMEOUT_SECONDS=${RAG_RERANK_TIMEOUT_SECONDS:-10}
      - KNOWLEDGE_IMPORT_DIR=/data/knowledge-imports
      - RAG_OCR_LANGUAGE=${RAG_OCR_LANGUAGE:-chi_sim+eng}
      - RAG_OCR_DPI=${RAG_OCR_DPI:-200}
      - RAG_OCR_WORKERS=${RAG_OCR_WORKERS:-2}
      - RAG_OCR_TIMEOUT_SECONDS=${RAG_OCR_TIMEOUT_SECONDS:-90}
      - RAG_VISUAL_ENABLED=${RAG_VISUAL_ENABLED:-true}
      - RAG_VISUAL_TIMEOUT_SECONDS=${RAG_VISUAL_TIMEOUT_SECONDS:-45}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
      network: ${BUILD_NETWORK:-default}
    ports:
      - "${WEB_PORT:-5001}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  remedi-data:
