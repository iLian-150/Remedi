# Remedi MVP 一键部署
# 用法：docker compose up -d --build
# 访问：http://服务器公网IP:8080

services:
  api:
    build: ./backend
    expose:
      - "8000"
    volumes:
      - remedi-data:/data
    environment:
      # SQLite 落盘到命名卷，容器重建数据不丢
      - DATABASE_URL=sqlite:////data/remedi.db
      - UPLOAD_DIR=/data/uploads
      - CORS_ORIGINS=*
      # 所有 AI 提问固定使用 Cloudflare；凭证通过服务器本地 override 或宿主环境变量提供。
      - LLM_PROVIDER=cloudflare
      - LLM_TIMEOUT_SECONDS=${LLM_TIMEOUT_SECONDS:-120}
      - CLOUDFLARE_ACCOUNT_ID=${CLOUDFLARE_ACCOUNT_ID:-}
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN:-}
      - CLOUDFLARE_MODEL=${CLOUDFLARE_MODEL:-@cf/qwen/qwen3-30b-a3b-fp8}
      - CLOUDFLARE_VISION_MODEL=${CLOUDFLARE_VISION_MODEL:-@cf/qwen/qwen3.8-27b}
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
    # 8080 避开宝塔自带 nginx 可能占用的 80 端口；如 80 空闲可改为 "80:80"
    ports:
      - "8080:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  remedi-data:
